services:
  php-fpm:
    build:
      context: .
      dockerfile: docker/prod/php/dockerfile
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
      - composer_cache:/root/.composer/cache
      - ./.env.docker:/var/www/html/.env:ro
    env_file:
      - .env.docker
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: shiproute-postgres
    environment:
      POSTGRES_DB: ship_route_db
      POSTGRES_USER: ship_route
      POSTGRES_PASSWORD: WIKFASweqoi23paosdf
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ship_route -d ship_route_db"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: shiproute-redis
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  nginx:
    image: ship_route_nginx
    build:
      context: .
      dockerfile: docker/prod/nginx/dockerfile
    environment:
      FPM_HOST: php-fpm
      FPM_PORT: 9000
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www/html
    depends_on:
      php-fpm:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  vendor:
  composer_cache: