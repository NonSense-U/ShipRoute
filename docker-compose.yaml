services:
  app:
    container_name: ship_route_backend
    build:
      context: .
      dockerfile: docker/dev/php/dockerfile.dev
    ports:
      - "8000:8000"
      - "8080:8080"
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
      - composer_cache:/root/.composer/cache
      - ./.env.docker:/var/www/html/.env:ro
    env_file:
      - .env.docker
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_healthy
    command: sh -c "composer install && supervisord -c /etc/supervisor/conf.d/supervisord.conf"
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: shiproute-postgres
    environment:
      POSTGRES_DB: ship_route_db
      POSTGRES_USER: ship_route
      POSTGRES_PASSWORD: WIKFASweqoi23paosdf
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ship_route -d ship_route_db"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: shiproute-redis
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: shiproute-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/dev/nginx/conf.d:/etc/nginx/conf.d
      - ./docker/dev/nginx/ssl:/etc/nginx/ssl
      - .:/var/www/html
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  vendor:
  composer_cache: